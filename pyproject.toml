[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdt"
version = "0.1.0"
description = "Sepsis Digital Twin: data foundation, quality gate, derived parameters, multimodal fusion, and counterfactual simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sepsis Digital Twin Contributors"}]
dependencies = [
    "numpy",
    "pandas>=2.1",
    "pyarrow",
    "duckdb>=1.0",
    "pyyaml",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
